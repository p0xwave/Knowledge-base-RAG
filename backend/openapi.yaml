openapi: 3.1.0
info:
  title: Knowledge Base RAG Backend API
  version: 0.1.0
paths:
  /api/user/auth:
    post:
      tags:
      - User
      summary: Аутентификация пользователя
      description: Вход пользователя по email и паролю. Возвращает JWT токен и данные
        пользователя.
      operationId: user_auth_api_user_auth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuth'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '403':
          description: User account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/user/me:
    get:
      tags:
      - User
      summary: Получить данные текущего пользователя
      description: Возвращает данные пользователя из JWT токена.
      operationId: get_current_user_api_user_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
      security:
      - HTTPBearer: []
  /api/user:
    put:
      tags:
      - User
      summary: Обновление данных пользователя
      description: Изменение email, username или пароля. Требует JWT токен.
      operationId: user_update_api_user_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChanges'
        required: true
      responses:
        '204':
          description: Successful Response
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '400':
          description: Invalid data or email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized or invalid old password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - User
      summary: Удаление пользователя
      description: Деактивация аккаунта пользователя. Требует JWT токен.
      operationId: user_delete_api_user_delete
      responses:
        '204':
          description: Successful Response
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
      security:
      - HTTPBearer: []
  /api/dialogue:
    post:
      tags:
      - Dialogue
      summary: Создать новый диалог
      description: Создание нового диалога для текущего пользователя. Требует JWT
        токен.
      operationId: create_dialogue_api_dialogue_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDialogue'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Dialogue
      summary: Получить список диалогов
      description: Возвращает список всех диалогов пользователя. Поддерживает фильтрацию
        по имени. Требует JWT токен.
      operationId: get_dialogues_api_dialogue_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Поисковый запрос для фильтрации по имени
          title: Query
        description: Поисковый запрос для фильтрации по имени
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortDialogue'
                title: Response Get Dialogues Api Dialogue Get
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dialogue/{dialogue_id}:
    get:
      tags:
      - Dialogue
      summary: Получить диалог по ID
      description: Возвращает полную информацию о диалоге. Требует JWT токен.
      operationId: get_dialogue_api_dialogue__dialogue_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: dialogue_id
        in: path
        required: true
        schema:
          type: integer
          title: Dialogue Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueResponse'
        '404':
          description: Dialogue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Dialogue
      summary: Обновить диалог
      description: Изменение имени диалога. Требует JWT токен.
      operationId: update_dialogue_api_dialogue__dialogue_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: dialogue_id
        in: path
        required: true
        schema:
          type: integer
          title: Dialogue Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDialogue'
      responses:
        '204':
          description: Successful Response
        '404':
          description: Dialogue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Dialogue
      summary: Удалить диалог
      description: Удаление диалога и всех связанных сообщений. Требует JWT токен.
      operationId: delete_dialogue_api_dialogue__dialogue_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: dialogue_id
        in: path
        required: true
        schema:
          type: integer
          title: Dialogue Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Dialogue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dialogue/queries/pre-generated:
    get:
      tags:
      - Dialogue
      summary: Получить предзаготовленные запросы
      description: Возвращает список предзаготовленных запросов для отображения в
        UI.
      operationId: get_pre_generated_queries_api_dialogue_queries_pre_generated_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PreGeneratedQuery'
                type: array
                title: Response Get Pre Generated Queries Api Dialogue Queries Pre
                  Generated Get
  /api/message:
    post:
      tags:
      - Message
      summary: Отправить сообщение
      description: Отправка сообщения в диалог. Сообщение обрабатывается RAG API и
        возвращается ответ. Требует JWT токен.
      operationId: send_message_api_message_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__message__models__MessageResponse'
        '404':
          description: Dialogue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '503':
          description: RAG API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '500':
          description: RAG API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/message/stream:
    post:
      tags:
      - Message
      summary: Отправить сообщение (streaming)
      description: Streaming-ответ с SSE событиями chunk/complete. Требует JWT токен.
      operationId: send_message_stream_api_message_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Dialogue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '503':
          description: RAG API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '500':
          description: RAG API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/message/feedback:
    post:
      tags:
      - Message
      summary: Установить обратную связь
      description: Установка like/dislike для сообщения. Требует JWT токен.
      operationId: set_feedback_api_message_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageFeedback'
        required: true
      responses:
        '204':
          description: Successful Response
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/source:
    post:
      tags:
      - Source
      summary: Загрузить источник
      description: 'Загрузка нового источника документа. Поддерживаемые форматы: md,
        txt, pdf, docx. Максимальный размер: 10 MB. Требует JWT токен.'
      operationId: upload_source_api_source_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_source_api_source_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceForList'
        '400':
          description: Invalid file or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Source
      summary: Получить список источников
      description: Возвращает список всех источников пользователя с пагинацией. Поддерживает
        полнотекстовый поиск по имени и/или содержимому. Требует JWT токен.
      operationId: get_sources_list_api_source_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Поисковый запрос для полнотекстового поиска
          title: Query
        description: Поисковый запрос для полнотекстового поиска
      - name: search_in
        in: query
        required: false
        schema:
          type: string
          pattern: ^(name|content|both)$
          description: 'Где искать: ''name'' (только в названии), ''content'' (только
            в содержимом), ''both'' (в обоих)'
          default: both
          title: Search In
        description: 'Где искать: ''name'' (только в названии), ''content'' (только
          в содержимом), ''both'' (в обоих)'
      - name: folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: ID папки для фильтрации (null = все документы)
          title: Folder Id
        description: ID папки для фильтрации (null = все документы)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Номер страницы
          default: 1
          title: Page
        description: Номер страницы
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Количество элементов на странице
          default: 10
          title: Limit
        description: Количество элементов на странице
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/source/{source_id}:
    get:
      tags:
      - Source
      summary: Получить содержимое источника
      description: Возвращает полное содержимое источника по ID. Требует JWT токен.
      operationId: get_source_api_source__source_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceContent'
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Source
      summary: Переместить источник в папку
      description: Перемещает источник в указанную папку (или в корень, если folder_id=null).
        Требует JWT токен.
      operationId: move_source_api_source__source_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceMoveRequest'
      responses:
        '204':
          description: Successful Response
        '404':
          description: Source or folder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Source
      summary: Удалить источник
      description: Удаление источника документа. Требует JWT токен.
      operationId: delete_source_api_source__source_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/source/{source_id}/download:
    get:
      tags:
      - Source
      summary: Скачать источник
      description: Скачивание файла источника. Требует JWT токен.
      operationId: download_source_api_source__source_id__download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: integer
          title: Source Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/folder:
    get:
      tags:
      - folders
      summary: Get Folders
      description: Get all folders for the current user with document counts
      operationId: get_folders_api_folder_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FolderResponse'
                type: array
                title: Response Get Folders Api Folder Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - folders
      summary: Create Folder
      description: Create a new folder
      operationId: create_folder_api_folder_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/folder/{folder_id}:
    patch:
      tags:
      - folders
      summary: Move Folder
      description: Move folder under a different parent (or to root if parent_id=null).
      operationId: move_folder_api_folder__folder_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
          title: Folder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderMoveRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - folders
      summary: Delete Folder
      description: Delete a folder (and all its contents)
      operationId: delete_folder_api_folder__folder_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: integer
          title: Folder Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/code/execute:
    post:
      tags:
      - Code
      summary: Выполнить Python-код
      description: Исполняет произвольный Python-код в изолированной песочнице (сервис
        code-executor). Используется фронтендом для запуска кода из ответа модели,
        в том числе отредактированного пользователем.
      operationId: execute_code_api_code_execute_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCodeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteCodeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__common__ErrorMessage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/dataset:
